# Disposable rosbridge for OHH-230. No robot is attached.
# Headset-facing port is 9090 on the host.
services:
  rosbridge:
    image: ros:humble-ros-base
    ports:
      - "9090:9090"
    init: true
    volumes:
      - ./start-rosbridge.sh:/start-rosbridge.sh:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',9090),2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    command: ["bash", "/start-rosbridge.sh"]
