# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: "Be concise, direct and constructive. Flag real bugs, security gaps and edge cases first; skip nitpicks that tooling already catches."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "Assets/{Scripts,Ohho,Twin,XR,Editor}/**/*.cs"
      instructions: |
        Unity C# for Meta Quest. Keep within frame budget: flag allocations, LINQ, string building,
        Find/GetComponent in Update/FixedUpdate/LateUpdate. Check teleop/network code handles
        disconnects safely, and that Editor-only code is guarded.
    - path: "Assets/Shaders/**"
      instructions: |
        Check shaders are mobile/Quest friendly (precision, overdraw, variants).
    - path: "{Assets/Tests,Tests}/**"
      instructions: |
        Check tests are deterministic and not frame-timing dependent.
    - path: "Packages/manifest.json"
      instructions: |
        Check package versions are pinned and changes are intentional.
    - path: ".github/workflows/**"
      instructions: |
        Check actions are pinned (ideally to a commit SHA), permissions follow least privilege,
        secrets are never echoed or exposed to untrusted PR code, and caching/matrix logic is correct.
    - path: "**/*.md"
      instructions: |
        Check docs stay accurate against the code (commands, paths, flags). Flag unverifiable claims.
