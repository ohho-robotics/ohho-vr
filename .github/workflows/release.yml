# Tag-triggered Quest release. Signing material stays in GitHub Actions secrets.
# Docs and the secret checklist: docs/release.md
# Debug sideload builds (ci/debug.keystore, alias androiddebugkey) are a different key.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      OHHO_VR_RELEASE_KEYSTORE_BASE64: ${{ secrets.OHHO_VR_RELEASE_KEYSTORE_BASE64 }}
      OHHO_VR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OHHO_VR_RELEASE_KEYSTORE_PASSWORD }}
      OHHO_VR_RELEASE_KEY_ALIAS: ${{ secrets.OHHO_VR_RELEASE_KEY_ALIAS }}
      OHHO_VR_RELEASE_KEY_PASSWORD: ${{ secrets.OHHO_VR_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Require release and Unity licence secrets
        run: |
          set -euo pipefail
          missing=()
          for name in \
            UNITY_LICENSE \
            UNITY_EMAIL \
            UNITY_PASSWORD \
            OHHO_VR_RELEASE_KEYSTORE_BASE64 \
            OHHO_VR_RELEASE_KEYSTORE_PASSWORD \
            OHHO_VR_RELEASE_KEY_ALIAS \
            OHHO_VR_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Add them at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions. See docs/release.md."
            exit 1
          fi
          echo "Release and Unity licence secrets are set. Values are not printed."

      # The Android editor image is large; free runner disk space before pulling it.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Self-test versionCode and player-settings rules
        run: python3 .github/workflows/release_support.py self-test

      - name: bundleVersion and versionCode from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/workflows/release_support.py version --tag "$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure keytool is available
        run: |
          set -euo pipefail
          if ! command -v keytool >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jre-headless
          fi

      - name: Check release keystore (not the CI debug key)
        id: keystore
        run: python3 .github/workflows/release_support.py check-keystore >> "$GITHUB_OUTPUT"

      - name: Force IL2CPP ARM64 and the release package id
        run: python3 .github/workflows/release_support.py patch-settings

      # Same ADTM batchmode abort as the edit-mode job. Runner-only; not committed.
      # Unity reads this while building, so the tag APK also has Unity audio disabled.
      - name: Disable Unity audio for headless batchmode
        run: python3 .github/workflows/release_support.py disable-batchmode-audio

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Release-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-Release-

      # Default UnityBuilderAction applies -buildVersion, -androidVersionCode, and the keystore.
      # androidKeystoreBase64 is decoded to ohho-vr-release.keystore in the workspace (gitignored).
      - uses: game-ci/unity-builder@v4
        id: builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.2f1
          customImage: unityci/editor:ubuntu-6000.5.2f1-android-3
          targetPlatform: Android
          buildName: OhhO-VR
          buildsPath: build
          versioning: Custom
          version: ${{ steps.version.outputs.bundle_version }}
          androidVersionCode: ${{ steps.version.outputs.version_code }}
          androidExportType: androidPackage
          allowDirtyBuild: true
          androidKeystoreName: ohho-vr-release.keystore
          androidKeystoreBase64: ${{ secrets.OHHO_VR_RELEASE_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.OHHO_VR_RELEASE_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.OHHO_VR_RELEASE_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.OHHO_VR_RELEASE_KEY_PASSWORD }}

      - name: Delete release keystore from the workspace
        if: always()
        run: rm -f ohho-vr-release.keystore

      - name: Confirm builder version matches the tag
        run: |
          set -euo pipefail
          if [ "${{ steps.builder.outputs.buildVersion }}" != "${{ steps.version.outputs.bundle_version }}" ]; then
            echo "::error::unity-builder buildVersion '${{ steps.builder.outputs.buildVersion }}' != tag bundleVersion '${{ steps.version.outputs.bundle_version }}'"
            exit 1
          fi
          if [ "${{ steps.builder.outputs.androidVersionCode }}" != "${{ steps.version.outputs.version_code }}" ]; then
            echo "::error::unity-builder androidVersionCode '${{ steps.builder.outputs.androidVersionCode }}' != '${{ steps.version.outputs.version_code }}'"
            exit 1
          fi

      - name: Verify APK, write SHA-256, render release notes
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE_VERSION: ${{ steps.version.outputs.bundle_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          COMMIT: ${{ github.sha }}
          CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          src="build/Android/OhhO-VR.apk"
          if [ ! -f "$src" ]; then
            src="$(find build -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "${src:-}" ] || [ ! -f "$src" ]; then
            echo "::error::Android build did not produce an APK"
            exit 1
          fi
          mkdir -p dist
          apk_name="OhhO-VR-${TAG}.apk"
          cp -f "$src" "dist/${apk_name}"
          python3 .github/workflows/release_support.py verify-apk \
            --apk "dist/${apk_name}" \
            --bundle-version "$BUNDLE_VERSION"
          (
            cd dist
            sha256sum "$apk_name" | tee "${apk_name}.sha256"
          )
          sha256="$(cut -d' ' -f1 "dist/${apk_name}.sha256")"
          export TAG BUNDLE_VERSION VERSION_CODE COMMIT CERT_SHA256
          export SHA256="$sha256"
          export APK_NAME="$apk_name"
          python3 .github/workflows/release_support.py render-notes \
            --template docs/release-notes-template.md \
            --out dist/release-notes.md
          {
            echo "### OhhO VR ${TAG}"
            echo ""
            echo "- bundleVersion: \`${BUNDLE_VERSION}\`"
            echo "- versionCode: \`${VERSION_CODE}\`"
            echo "- package: \`com.ohhorobotics.ohhovr\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- certificate SHA-256: \`${CERT_SHA256}\`"
            echo "- signing: release keystore from GitHub secrets (not the CI debug keystore)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: OhhO-VR-${{ github.ref_name }}
          path: |
            dist/OhhO-VR-${{ github.ref_name }}.apk
            dist/OhhO-VR-${{ github.ref_name }}.apk.sha256
            dist/release-notes.md
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OhhO VR ${{ github.ref_name }}
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') && 'true' || 'false' }}
          files: |
            dist/OhhO-VR-${{ github.ref_name }}.apk
            dist/OhhO-VR-${{ github.ref_name }}.apk.sha256
          fail_on_unmatched_files: true
